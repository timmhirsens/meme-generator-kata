[project]
name = "meme-generator"
version = "0.1.0"
description = "Meme Generator Service (DankDeploy kata)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "fonttools>=4.60",
    "pillow>=11",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pyright>=1.1.400",
    "pytest>=8",
    "pytest-playwright>=0.10.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meme_generator"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "e2e"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests", "e2e"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
